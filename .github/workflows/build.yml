name: Build and Deploy
on:
    push:
        branches:
            - master
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: "actions/checkout@v2"
              with:
                  submodules: true
            - name: "Update blog submodule"
              run: "cd src/blog && git fetch && git reset --hard origin/master"
            - name: "Set up Node.js"
              uses: "actions/setup-node@v4"
            - name: "Install dependencies"
              run: "npm ci"
            - name: Lint
              run: "npm run lint"
            - name: Build
              run: "npm run build"
            - name: "Upload artifact"
              uses: "actions/upload-pages-artifact@v3"
              with:
                  path: dist
    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        steps:
            - name: "Deploy to GitHub Pages"
              uses: "actions/deploy-pages@v4"
